<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Bug no Flexbox</title>
    <style>
        .barra-ferramentas {
            justify-content: space-between;
            display: flex;
            background-color: #2c3e50;
            padding: 10px;
            height: 80px;
            align-items: center;
            gap: 12px;
    
        }
        .botao{
            background-color: #3498db;
            color: white;
            padding: 10px 15px;
            border: none;
        }
    </style>
</head>
<body>
    <div class="barra-ferramentas">
        <button class="botao">Novo</button>
        <button class="botao">Abrir</button>
        <button class="botao">Salvar</button>
        <button class="botao">Excluir</button>
    </div>
</body>
</html>
